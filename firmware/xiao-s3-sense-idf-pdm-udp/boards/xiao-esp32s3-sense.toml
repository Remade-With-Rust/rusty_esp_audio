# Seeed Studio XIAO ESP32-S3 Sense — the on-board PDM microphone.
# Source: Seeed's XIAO ESP32S3 Sense microphone example (`I2S.setPinsPdmRx(42, 41)`).
[board]
name = "xiao-esp32s3-sense"
chip = "esp32s3"
flash_mb = 8
psram_mb = 8

[mic]
kind = "pdm"
model = "MSM261D3526H1CPM"
clk = 42
data = 41
sample_rate_hz = 16000
bits = 16
channels = 1
