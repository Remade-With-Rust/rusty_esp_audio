[package]
name = "rusty_esp_audio-core"
description = "The pure no_std + alloc core of rusty_esp_audio: types, traits and algorithms with no drivers, no allocator and no product types. forbid(unsafe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_audio-core"
keywords = ["esp32", "embedded", "no-std", "mata", "remade-with-rust"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal.
std = ["alloc", "rusty_esp_core/std", "rusty_esp_dsp/std"]
alloc = ["rusty_esp_core/alloc", "rusty_esp_dsp/alloc"]
# FLAC via the house codec. Needs `alloc` (rusty_flac buffers the stream it
# builds); `rusty_flac/libm` keeps host and chip encoders bit-identical.
flac = ["alloc", "dep:rusty_flac"]

[dependencies]
rusty_esp_core = { workspace = true }
rusty_esp_dsp = { workspace = true }
# The I2C trait the codec chips ride on. 1.0 is the stable embedded-hal; no_std.
embedded-hal = "1.0"
# The `no-std` branch until it is released to crates.io (Janus plan A3).
rusty_flac = { version = "0.1.3", default-features = false, features = ["libm"], optional = true }
# Pure-Rust libm for the handful of transcendentals (filter design, dB
# conversions, the test tone). Deterministic on host and chip; no_std; no deps.
libm = { version = "0.2", default-features = false }

[lints]
workspace = true
